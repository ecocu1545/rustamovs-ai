name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Sənin yüklədiyin zip faylını açır
      - name: Extract Project Zip
        run: unzip rustamovs-ai-clean.zip -d .

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      # Android mühitini quraşdırır və APK çıxarır
      - name: Build APK
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Rustamovs AI" com.rustamovs.ai --web-dir dist
          npx cap add android
          npx cap copy
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      # Hazır olan APK-nı sənə yükləmək üçün təqdim edir
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rustamovs-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
