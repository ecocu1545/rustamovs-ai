name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Faylları Düzəlt
        run: |
          # package.json yoxdursa, minimal versiya yarat
          if [ ! -f "package.json" ]; then
            npm init -y
            npm install @capacitor/core @capacitor/cli @capacitor/android
          fi
          # dist qovluğu yoxdursa yarat
          mkdir -p dist
          echo "<html><body>Rustamovs AI</body></html>" > dist/index.html

      - name: Kitabxanaları Yüklə
        run: |
          npm install --legacy-peer-deps || true
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Android Layihəsini Qur
        run: |
          # Capacitor konfiqurasiyası yoxdursa yarat
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            npx cap init "Rustamovs AI" com.rustamovs.ai --web-dir dist
          fi
          npx cap add android || true
          npx cap copy
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: APK-nı tap və yüklə
        uses: actions/upload-artifact@v4
        with:
          name: Rustamovs-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
